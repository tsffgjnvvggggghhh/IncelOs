name: Build IncelOS ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build IncelOS ISO inside Official Arch Linux Container
        run: |
          docker run --privileged --rm -v "$(pwd):/workspace" -w /workspace archlinux:latest bash -c "
            pacman -Syu --noconfirm &&
            pacman -S --noconfirm archiso &&
            mkdir -p out &&
            mkarchiso -v -w /tmp/archiso-work -o out archiso
          "

      - name: Calculate Checksums
        run: |
          cd out
          sha256sum *.iso > sha256sums.txt

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IncelOS-x86_64-ISO
          path: |
            out/*.iso
            out/sha256sums.txt

      - name: Release IncelOS ISO
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            out/*.iso
            out/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
